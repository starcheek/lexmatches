# Production override for a single server (README "Deploy on a server"):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only ports 80/443 are reachable from outside; the database, file storage and API are internal.
services:
  postgres:
    ports: !reset []
  minio:
    ports: !reset []
  api:
    ports: !reset []
  web:
    ports: !reset []

  # HTTPS with automatic certificates. Needs SITE_DOMAIN in .env and a DNS A record pointing at this server.
  caddy:
    image: caddy:2.11
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env, e.g. SITE_DOMAIN=read.example.com}
    volumes:
      # The directory, not the file: a deploy replaces the Caddyfile (new inode), which a single-file bind
      # mount would never show. deploy/remote-deploy.sh reloads Caddy after every deploy.
      - ./deploy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
