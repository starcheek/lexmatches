# Rate limits per visitor. Caddy always overwrites CF-Connecting-IP with the real client address
# (deploy/Caddyfile), so the key cannot be spoofed. Without Caddy (local dev) the key is empty: no limit.
limit_req_zone $http_cf_connecting_ip zone=auth:10m  rate=10r/m;
limit_req_zone $http_cf_connecting_ip zone=admin:10m rate=60r/m;
limit_req_zone $http_cf_connecting_ip zone=track:10m rate=30r/m;
limit_req_zone $http_cf_connecting_ip zone=api:10m   rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Uploads are capped by MAX_UPLOAD_MB (25 on the server); a little headroom for multipart overhead.
    client_max_body_size 30m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Login / signup: brute force and argon2 memory floods
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /api/admin/ {
        limit_req zone=admin burst=60 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Unauthenticated analytics endpoint
    location = /api/track {
        limit_req zone=track burst=30 nodelay;
        client_max_body_size 1m;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Never cache the service worker or the app shell
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
